name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'build_windows.ps1'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'build_windows.ps1'
      - '.github/workflows/windows-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==6.10.0

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          if (Test-Path "package-lock.json") { npm ci } else { npm install }
          npm run build

      - name: Run backend tests
        shell: pwsh
        run: |
          Set-Location backend
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build desktop executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean packaging/BarcoController.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\BarcoController.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcoController-Setup
          path: installer_output/BarcoController-Setup.exe
          if-no-files-found: error
